[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cis6930sp26-assignment1"
version = "0.1.0"
description = "ETL pipeline: extract, transform, load incident data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
